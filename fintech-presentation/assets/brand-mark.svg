<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="HSBC Hexagon redraw: standard, deck header and minimum size">
  <title>HSBC Hexagon - Redraw (non-official asset)</title>
  <desc>
    A geometric redraw of the HSBC Hexagon for use in fintech-presentation decks.
    Geometry follows the publicly visible mark; path data is referenced from the Simple Icons HSBC icon (CC0 1.0) and has been render-verified.
    The HSBC name and mark belong to HSBC Holdings plc. This file is not an official HSBC brand asset and is not published by HSBC.
    For formal or external material, sign in to https://create.hsbc/, download the official logo, and replace the #brand-hex definition in deck-shell.html.
  </desc>

  <defs>
    <!-- The single mark definition. To swap in the official asset, change only the path inside this symbol; the page needs no other edit. -->
    <symbol id="hsbc-hex" viewBox="0 5.9 24 12.2">
      <path fill="#DB0011" d="m24 12.007-5.996 5.997V5.996L24 12.007zm-5.996-6.01H6.01l5.996 6.01 5.997-6.01zM0 12.006l6.01 5.997V5.996L0 12.007zm6.01 5.997h11.994l-5.997-5.997-5.996 5.997z"/>
    </symbol>
  </defs>

  <style>
    text{font-family:'Nimbus Sans',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif;fill:#333333}
    .cap{font-size:13px;font-weight:600;fill:#000000}
    .sub{font-size:11px;fill:#767676}
    .rule{stroke:#D7D8D6;stroke-width:1}
  </style>

  <rect width="760" height="380" fill="#FFFFFF"/>

  <!-- Standard -->
  <text x="40" y="42" class="cap">01 · Standard</text>
  <text x="40" y="62" class="sub">White / brand red #DB0011 / ratio 24 : 12.2</text>
  <line x1="40" y1="76" x2="300" y2="76" class="rule"/>
  <rect x="40" y="100" width="260" height="180" fill="#F4F4F4"/>
  <use href="#hsbc-hex" x="70" y="139" width="200" height="102"/>

  <!-- Deck header -->
  <text x="330" y="42" class="cap">02 · Deck header</text>
  <text x="330" y="62" class="sub">Held by a white badge on dark covers; colour unchanged</text>
  <line x1="330" y1="76" x2="720" y2="76" class="rule"/>
  <rect x="330" y="100" width="390" height="180" fill="#141414"/>
  <rect x="646" y="120" width="54" height="34" fill="#FFFFFF" stroke="#D7D8D6" stroke-width="1"/>
  <use href="#hsbc-hex" x="655" y="129" width="36" height="18.3"/>
  <text x="350" y="162" style="font-size:21px;font-weight:700;fill:#FFFFFF">Making complexity clear</text>
  <text x="350" y="192" style="font-size:12px;fill:#D7D8D6">Internal talk · sample content</text>

  <!-- Minimum size -->
  <text x="40" y="322" class="cap">03 · Minimum size</text>
  <text x="40" y="342" class="sub">Below 32px the central counterform disappears</text>
  <line x1="40" y1="356" x2="720" y2="356" class="rule"/>
  <use href="#hsbc-hex" x="380" y="306" width="64" height="32.5"/>
  <use href="#hsbc-hex" x="480" y="312" width="32" height="16.3"/>
  <text x="540" y="326" class="sub">← 32px minimum</text>
</svg>
