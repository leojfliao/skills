  <g id="C08"><title>C08 Sample service B</title><rect x="500" y="344" width="200" height="72" rx="2" fill="#FFFFFF"/><use href="#icon-microservice" x="516" y="368" width="24" height="24"/><text x="552" y="378" font-size="14" fill="#333333" stroke="none">Sample service B</text><text x="552" y="397" font-size="11" fill="#767676" stroke="none">Service cluster</text><text x="688" y="360" font-size="10" fill="#767676" stroke="none" text-anchor="end">C08</text></g>
