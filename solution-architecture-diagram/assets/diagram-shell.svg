  <g id="C12"><title>C12 Sample queue</title><rect x="800" y="456" width="200" height="72" rx="2" fill="#FFFFFF"/><use href="#icon-queue" x="816" y="480" width="24" height="24"/><text x="852" y="490" font-size="14" fill="#333333" stroke="none">Sample queue</text><text x="852" y="509" font-size="11" fill="#767676" stroke="none">Async decoupling</text><text x="988" y="472" font-size="10" fill="#767676" stroke="none" text-anchor="end">C12</text></g>
