  <g id="C05"><title>C05 Sample load balancer</title><rect x="500" y="232" width="200" height="72" rx="2" fill="#FFFFFF"/><use href="#icon-loadbalancer" x="516" y="256" width="24" height="24"/><text x="552" y="266" font-size="14" fill="#333333" stroke="none">Sample load balancer</text><text x="552" y="285" font-size="11" fill="#767676" stroke="none">Traffic distribution</text><text x="688" y="248" font-size="10" fill="#767676" stroke="none" text-anchor="end">C05</text></g>
