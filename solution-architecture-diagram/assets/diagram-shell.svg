<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Sample: four-tier architecture shell with external, ingress, service and data tiers and one red focal path">
<title>Layered Architecture Shell (Sample)</title>
<defs>
  <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#767676"/></marker>
  <marker id="arrow-focus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#DB0011"/></marker>

  <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.5"/><path d="M4.5 21c0-4 3-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></symbol>
  <symbol id="icon-partner" viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="12" r="3"/><path d="M9 12h6M12 9.5 14 12l-2 2.5"/></symbol>
  <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 3h7v7M21 3l-9 9"/><path d="M19 14v6H4V5h6"/></symbol>
  <symbol id="icon-gateway" viewBox="0 0 24 24"><path d="M12 3 21 12l-9 9L3 12Z"/><path d="M8 12h8M13 9l3 3-3 3"/></symbol>
  <symbol id="icon-loadbalancer" viewBox="0 0 24 24"><path d="M12 3v5M12 8H5v5M12 8h7v5M5 13v3M12 13v3M19 13v3"/><rect x="2" y="16" width="6" height="4" rx="1"/><rect x="9" y="16" width="6" height="4" rx="1"/><rect x="16" y="16" width="6" height="4" rx="1"/></symbol>
  <symbol id="icon-api" viewBox="0 0 24 24"><path d="M9 4c-2 0-2 3-2 4s0 2-2 2c2 0 2 1 2 2s0 4 2 4M15 4c2 0 2 3 2 4s0 2 2 2c-2 0-2 1-2 2s0 4-2 4"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="icon-service" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 12h8M8 15h5"/></symbol>
  <symbol id="icon-microservice" viewBox="0 0 24 24"><rect x="2.5" y="9" width="5" height="5" rx="1"/><rect x="16.5" y="3" width="5" height="5" rx="1"/><rect x="16.5" y="16" width="5" height="5" rx="1"/><path d="M7.5 11.5H12V5.5h4.5M12 11.5v7h4.5"/></symbol>
  <symbol id="icon-scheduler" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2"/></symbol>
  <symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  <symbol id="icon-cache" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M13 6 9 13h4l-1 5 4-7h-4Z"/></symbol>
  <symbol id="icon-queue" viewBox="0 0 24 24"><rect x="2.5" y="8" width="5" height="8" rx="1"/><rect x="9.5" y="8" width="5" height="8" rx="1"/><rect x="16.5" y="8" width="5" height="8" rx="1"/><path d="M7.5 12h2M14.5 12h2"/></symbol>
</defs>

<rect x="0" y="0" width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="56" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#000000">Layered System Architecture (Sample Shell)</text>
<text x="48" y="80" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#767676">Figure 1 · What this diagram answers: which components a request crosses from external actors to the data tier. Sample content only; replace all component names.</text>

